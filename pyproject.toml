[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predictable-latents"
version = "0.1.0"
description = "Code for the paper Video World Models Need Predictable Latents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mattia Scardecchia"}, {name = "Sherry Yang"}]
requires-python = ">=3.11"
dependencies = [
 "torch==2.9.0", "torchvision==0.24.0", "pytorch-lightning==2.5.5",
 "diffusers==0.35.2", "transformers==4.49.0", "einops==0.8.1",
 "numpy==2.3.4", "omegaconf==2.3.0",
 "torchmetrics==1.8.2", "pytorchvideo==0.1.5", "av>=13,<17",
 "scipy>=1.14", "scikit-learn==1.8.0",
 "tqdm>=4.66", "requests>=2.31", "Pillow>=10"
]

[project.urls]
Repository = "https://github.com/mattia-scardecchia/predictable-latents"

[project.optional-dependencies]
evaluation = ["torch-fidelity==0.4.0", "pandas>=2"]
conversion = ["tensorflow>=2.19", "tensorflow-datasets>=4.9"]
worldgym = ["opencv-python-headless>=4.9", "openai>=1,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wm_repr = ["configs/*.yaml", "configs/*.json", "configs/**/*.yaml", "configs/**/*.json"]
